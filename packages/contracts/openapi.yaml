openapi: 3.0.3
info:
  title: API de gestión de incidencias
  version: 0.1.0
  description: >-
    Contrato inicial de la plataforma. Las operaciones se implementarán por
    iteración; publicar este archivo no implica que los endpoints estén activos.
x-access-roles:
  - SuperAdministrador
  - AdministradorInstitucional
  - Operador
  - Ciudadano
x-access-policy:
  public: [health, register, login, refresh, logout, password-reset, directory, alerts, aggregated-heatmap]
  citizen: [create-mobile-incident, own-incidents, own-evidence, own-notifications]
  operator: [institutional-inbox, phone-incident, verification, dispatch, status, authorized-map]
  institutional-admin: [institutional-users, own-sites, own-resources, own-audit]
  super-admin: [all-institutions, catalogs, territories, routing-rules, global-audit]
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local (desde Iteración 1)
tags:
  - name: Technical
  - name: Auth
  - name: Incidents
  - name: Operations
  - name: Institutions
  - name: Territory
  - name: Resources
  - name: Catalog
  - name: Public
paths:
  /api/health:
    servers:
      - url: http://localhost:3000
        description: Raíz HTTP local para endpoints técnicos
    get:
      tags: [Technical]
      summary: Comprobar que el proceso HTTP está activo
      operationId: getProcessHealth
      responses:
        '200':
          description: Proceso activo
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/health/database:
    servers:
      - url: http://localhost:3000
        description: Raíz HTTP local para endpoints técnicos
    get:
      tags: [Technical]
      summary: Comprobar conectividad real con MySQL
      operationId: getDatabaseHealth
      responses:
        '200':
          description: Consulta de diagnóstico correcta
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [connected] }
        '503':
          description: Base de datos no disponible o credenciales rechazadas
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthError'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar ciudadano
      operationId: registerCitizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar token de actualización
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Nuevos tokens; el token anterior queda revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar token de actualización
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sesión revocada }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicitar recuperación sin revelar si existe el correo
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirmar token de un uso y establecer contraseña nueva
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '200':
          description: Contraseña actualizada y sesiones anteriores invalidadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /incidents:
    post:
      tags: [Incidents]
      summary: Crear reporte ciudadano o preliminar de invitado
      description: >-
        Un invitado genera un reporte no verificado. El servidor fija source=MOBILE_APP.
        Idempotency-Key o clientRequestId evita duplicados; un reintento idéntico devuelve 200.
      operationId: createIncident
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Reporte recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReceipt'
        '200':
          description: Reintento idéntico con la misma referencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /incidents/mine:
    get:
      tags: [Incidents]
      summary: Listar reportes propios
      operationId: listMyIncidents
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Reportes del ciudadano autenticado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Obtener detalle autorizado
      operationId: getIncident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Detalle del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{id}/evidence:
    post:
      tags: [Incidents]
      summary: Adjuntar fotografía al reporte
      operationId: uploadIncidentEvidence
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Fotografía almacenada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceMetadata'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /incidents/{id}/evidence/{evidenceId}:
    get:
      tags: [Incidents]
      summary: Leer fotografía privada y auditar acceso
      operationId: readIncidentEvidence
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Bytes de imagen autorizada, sin URL pública estable
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /ops/incidents/phone:
    post:
      tags: [Operations]
      summary: Registrar reporte telefónico con fuente PHONE fijada por el servidor
      operationId: createPhoneIncident
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneIncidentRequest' }
      responses:
        '201':
          description: Llamada registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReceipt' }
        '200':
          description: Reintento idéntico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listIncidentCategories
      responses:
        '200':
          description: Categorías activas con prioridad inicial
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IncidentCategory' } }
    post:
      tags: [Catalog]
      operationId: createIncidentCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentCategoryInput' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCategory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /catalog/categories/{id}:
    patch:
      tags: [Catalog]
      operationId: updateIncidentCategory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentCategoryInput' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCategory' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/categories/{id}/subcategories:
    get:
      tags: [Catalog]
      operationId: listIncidentSubcategories
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Subcategorías activas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IncidentSubcategory' } }
    post:
      tags: [Catalog]
      operationId: createIncidentSubcategory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentSubcategoryInput' }
      responses:
        '201':
          description: Subcategoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSubcategory' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/subcategories/{id}:
    patch:
      tags: [Catalog]
      operationId: updateIncidentSubcategory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentSubcategoryInput' }
      responses:
        '200':
          description: Subcategoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSubcategory' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/incidents:
    get:
      tags: [Operations]
      summary: Bandeja institucional filtrada por ámbito autorizado
      operationId: listOperationalIncidents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IncidentStatus' }
        - { name: exception, in: query, schema: { type: boolean }, description: Solo incidentes sin sede sugerida }
      responses:
        '200':
          description: Incidencias autorizadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /ops/incidents/{id}/suggestions:
    get:
      tags: [Operations]
      summary: Sugerir sedes activas por regla y cobertura o indicar excepción
      operationId: getIncidentSuggestions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IncidentId' }]
      responses:
        '200':
          description: Sedes sugeridas y estado de excepción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/incidents/{id}/verification:
    patch:
      tags: [Operations]
      summary: Verificar reporte y ajustar prioridad con motivo
      operationId: verifyIncident
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IncidentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyIncidentRequest' }
      responses:
        '200':
          description: Verificación y prioridad persistidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /ops/incidents/{id}/status:
    patch:
      tags: [Operations]
      summary: Actualizar estado de atención
      operationId: updateIncidentStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { $ref: '#/components/schemas/IncidentStatus' }
                assignmentId: { type: string, format: uuid, description: Requerido para hitos de una institución }
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /ops/incidents/{id}/assignments:
    get:
      tags: [Operations]
      summary: Listar asignaciones visibles de la incidencia
      operationId: listIncidentAssignments
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IncidentId' }]
      responses:
        '200':
          description: Asignaciones del ámbito
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operations]
      summary: Asignar institución, sede, unidades y personal
      operationId: createAssignment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /ops/incidents/{id}/duplicates:
    post:
      tags: [Operations]
      summary: Vincular reporte duplicado sin borrar referencias
      operationId: linkDuplicateIncident
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IncidentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateRequest' }
      responses:
        '201':
          description: Vínculo conservado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ops/incidents/{id}/history:
    get:
      tags: [Operations]
      summary: Línea de tiempo operativa autorizada
      operationId: getIncidentHistory
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IncidentId' }]
      responses:
        '200':
          description: Hitos, actor y notas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HistoryEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/institutions:
    get:
      tags: [Institutions]
      summary: Listar instituciones autorizadas
      operationId: listInstitutions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Instituciones visibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Institution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Institutions]
      summary: Registrar institución
      operationId: createInstitution
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstitutionRequest' }
      responses:
        '201':
          description: Institución creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/institutions/{id}:
    get:
      tags: [Institutions]
      operationId: getInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      responses:
        '200':
          description: Institución autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Institutions]
      operationId: updateInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstitutionRequest' }
      responses:
        '200':
          description: Institución actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Institutions]
      operationId: deactivateInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      responses:
        '204': { description: Institución desactivada sin borrar historial }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /territory/departments:
    get:
      tags: [Territory]
      operationId: listDepartments
      responses:
        '200':
          description: Departamentos configurados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
  /territory/provinces:
    get:
      tags: [Territory]
      operationId: listProvinces
      parameters: [{ name: departmentId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Provincias configuradas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /territory/districts:
    get:
      tags: [Territory]
      operationId: listDistricts
      parameters: [{ name: provinceId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Distritos configurados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /territory/sectors:
    get:
      tags: [Territory]
      operationId: listSectors
      parameters: [{ name: districtId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Sectores configurados
          content:
            application/json:
