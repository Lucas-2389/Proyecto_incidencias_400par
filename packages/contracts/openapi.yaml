      parameters:
        - $ref: '#/components/parameters/GeoFrom'
        - $ref: '#/components/parameters/GeoTo'
        - $ref: '#/components/parameters/GeoType'
        - $ref: '#/components/parameters/GeoCategory'
        - $ref: '#/components/parameters/GeoHour'
        - $ref: '#/components/parameters/GeoDistrict'
        - $ref: '#/components/parameters/GeoInstitution'
      responses:
        '200':
          description: Conteos por celda agregada
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HeatmapCell' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GeoFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    GeoTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    GeoType:
      name: type
      in: query
      schema: { type: string, enum: [emergency, security] }
    GeoCategory:
      name: categoryId
      in: query
      schema: { type: integer, minimum: 1 }
    GeoHour:
      name: hour
      in: query
      schema: { type: integer, minimum: 0, maximum: 23 }
    GeoDistrict:
      name: districtId
      in: query
      schema: { type: integer, minimum: 1 }
    GeoInstitution:
      name: institutionId
      in: query
      schema: { type: string, format: uuid }
    InstitutionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificador único del intento de creación generado por el cliente.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Acceso fuera del rol o ámbito autorizado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflicto de estado o duplicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Límite de solicitudes superado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: Fotografía supera el límite de tamaño
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnprocessableEntity:
      description: Contraseña fuera de la política de seguridad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Servicio de autenticación o recuperación no configurado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    SuggestionResult:
      type: object
      required: [incidentId, suggestions, exception]
      properties:
        incidentId: { type: string, format: uuid }
        exception: { type: boolean }
        suggestions:
          type: array
          items:
            type: object
            required: [siteId, institutionId, institutionType, ruleId, reason]
            properties:
              siteId: { type: string }
              siteName: { type: string }
              institutionId: { type: string }
              institutionName: { type: string }
              institutionType: { type: string }
              ruleId: { type: integer }
              priority: { type: integer }
              reason: { type: string }
    VerifyIncidentRequest:
      type: object
      required: [verificationStatus, reason]
      properties:
        verificationStatus: { type: string, enum: [verified, unverifiable, 'false', duplicate] }
        priority: { type: string, enum: [low, normal, high, critical] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    VerificationResult:
      type: object
      required: [id, verificationStatus, priority]
      properties:
        id: { type: string }
        verificationStatus: { type: string }
        priority: { type: string }
    StatusResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        assignmentId: { type: string }
        assignmentStatus: { type: string }
    DuplicateRequest:
      type: object
      required: [primaryIncidentId, reason]
      properties:
        primaryIncidentId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    DuplicateLink:
      type: object
      required: [duplicateIncidentId, primaryIncidentId, reason]
      properties:
        duplicateIncidentId: { type: string }
        primaryIncidentId: { type: string }
        reason: { type: string }
    HistoryEvent:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: { type: integer }
        assignmentId: { type: string, nullable: true }
        actorUserId: { type: string, nullable: true }
        eventType: { type: string }
        previousValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    IncidentCategoryInput:
      type: object
      required: [code, name, family]
      properties:
        code: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 120 }
        family: { type: string, enum: [emergency, security] }
        defaultPriority: { type: string, enum: [low, normal, high, critical] }
        isSensitive: { type: boolean }
        active: { type: boolean }
    IncidentCategory:
      allOf:
        - { $ref: '#/components/schemas/IncidentCategoryInput' }
        - type: object
          required: [id, defaultPriority, active, isDemo]
          properties:
            id: { type: integer }
            isDemo: { type: boolean }
    IncidentSubcategoryInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 120 }
        isSensitive: { type: boolean }
        active: { type: boolean }
    IncidentSubcategory:
      allOf:
        - { $ref: '#/components/schemas/IncidentSubcategoryInput' }
        - type: object
          required: [id, categoryId, active, isDemo]
          properties:
            id: { type: integer }
            categoryId: { type: integer }
            isDemo: { type: boolean }
    PhoneIncidentRequest:
      type: object
      required: [institutionId, siteId, categoryId, description]
      properties:
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        categoryId: { type: integer }
        subcategoryId: { type: integer }
        description: { type: string, minLength: 1, maxLength: 2000 }
        location: { allOf: [{ $ref: '#/components/schemas/Coordinates' }], nullable: true }
        callerContact: { type: string, maxLength: 100 }
        clientRequestId: { type: string, maxLength: 128 }
    PersonnelInput:
      type: object
      required: [institutionId, siteId, code, name]
      properties:
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 150 }
        roleDescription: { type: string, maxLength: 100, nullable: true }
        active: { type: boolean }
    Personnel:
      allOf:
        - { $ref: '#/components/schemas/PersonnelInput' }
        - type: object
          required: [id, active, isDemo]
          properties:
            id: { type: string, format: uuid }
            isDemo: { type: boolean }
    UnitInput:
      type: object
      required: [institutionId, siteId, code, type]
      properties:
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        type: { type: string, maxLength: 80 }
        plate: { type: string, maxLength: 30, nullable: true }
        capacityDescription: { type: string, maxLength: 200, nullable: true }
    UnitStatus:
      type: string
      enum: [available, assigned, en_route, attending, returning, maintenance, out_of_service]
    Unit:
      allOf:
        - { $ref: '#/components/schemas/UnitInput' }
        - type: object
          required: [id, status, isDemo]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/UnitStatus' }
            isDemo: { type: boolean }
    Territory:
      type: object
      required: [id, code, name, isDemo]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        isDemo: { type: boolean }
        departmentId: { type: integer }
        provinceId: { type: integer }
        districtId: { type: integer }
    TerritoryResolution:
      type: object
      required: [latitude, longitude, district, sector]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        district: { allOf: [{ $ref: '#/components/schemas/Territory' }], nullable: true }
        sector: { allOf: [{ $ref: '#/components/schemas/Territory' }], nullable: true }
    SiteInput:
      type: object
      required: [institutionId, name, location]
      properties:
        institutionId: { type: string, format: uuid }
        districtId: { type: integer }
        name: { type: string }
        address: { type: string }
        contactPhone: { type: string }
        location:
          type: object
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean }
    Site:
      allOf:
        - { $ref: '#/components/schemas/SiteInput' }
        - type: object
          required: [id, active, isDemo]
          properties:
            id: { type: string, format: uuid }
            isDemo: { type: boolean }
    CoverageInput:
      type: object
      required: [name, coordinates]
      properties:
        name: { type: string }
        coordinates:
          type: array
          minItems: 4
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    CoverageZone:
      type: object
      required: [id, siteId, institutionId, name, active, isDemo, geometry]
      properties:
        id: { type: integer }
        siteId: { type: string }
        institutionId: { type: string }
        name: { type: string }
        active: { type: boolean }
        isDemo: { type: boolean }
        geometry: { type: object, description: GeoJSON MultiPolygon }
    CoveredSite:
      type: object
      required: [siteId, institutionId, siteName]
      properties:
        siteId: { type: string }
        institutionId: { type: string }
        siteName: { type: string }
    InstitutionalUserInput:
      type: object
      required: [name, email, password, role, institutionId, siteId]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        role: { type: string, enum: [Operador, AdministradorInstitucional] }
        institutionId: { type: string }
        siteId: { type: string }
    InstitutionalUser:
      type: object
      required: [id, name, email, status, role, institutionId, siteId]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive] }
        role: { type: string }
        institutionId: { type: string }
        siteId: { type: string }
    DatabaseHealthError:
      type: object
      required: [status, database, code, message, correlationId]
      properties:
        status: { type: string, enum: [error] }
        database: { type: string, enum: [unavailable] }
        code: { type: string, enum: [DATABASE_UNAVAILABLE] }
        message: { type: string }
        correlationId: { type: string, format: uuid }
    ApiError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        correlationId: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, acceptedTerms]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        acceptedTerms: { type: boolean, enum: [true] }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 40, maxLength: 256 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 40, maxLength: 256 }
        password: { type: string, format: password, minLength: 12 }
    AcceptedStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    OkStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Duración en segundos }
        user:
          type: object
          required: [id, name, email, roles]
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            roles:
              type: array
              items: { type: string }
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        reference: { type: string, maxLength: 500 }
    CreateIncidentRequest:
      type: object
      required: [categoryId, location, description]
      properties:
        categoryId: { type: integer }
        subcategoryId: { type: integer }
        location: { $ref: '#/components/schemas/Coordinates' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        affectedPeople: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        clientRequestId: { type: string, maxLength: 128 }
    IncidentStatus:
      type: string
      enum: [reported, verifying, assigned, en_route, attending, resolved, closed]
    IncidentReceipt:
      type: object
      required: [id, reference, status, verified, source, createdAt]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        verified: { type: boolean }
        source: { type: string, enum: [MOBILE_APP, PHONE] }
        createdAt: { type: string, format: date-time }
    IncidentSummary:
      allOf:
        - $ref: '#/components/schemas/IncidentReceipt'
        - type: object
          properties:
            categoryId: { type: integer }
            subcategoryId: { type: integer, nullable: true }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            description: { type: string }
            location: { allOf: [{ $ref: '#/components/schemas/Coordinates' }], nullable: true }
            evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceMetadata' } }
    EvidenceMetadata:
      type: object
      required: [id, mediaType, uploadedAt]
      properties:
        id: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        uploadedAt: { type: string, format: date-time }
    CreateAssignmentRequest:
      type: object
      required: [institutionId, siteId]
      properties:
        institutionId: { type: string }
        siteId: { type: string }
        operatorUserId: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000, description: Obligatorio cuando se corrige una sugerencia }
        unitIds: { type: array, items: { type: string }, uniqueItems: true }
        personnelIds: { type: array, items: { type: string }, uniqueItems: true }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/CreateAssignmentRequest'
        - type: object
          required: [id, incidentId, createdAt]
          properties:
            id: { type: string }
            incidentId: { type: string }
            createdAt: { type: string, format: date-time }
            status: { type: string }
            corrected: { type: boolean }
    CreateInstitutionRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [pnp, samu, bomberos, municipalidad, otra] }
        contactPhone: { type: string }
    Institution:
      allOf:
        - $ref: '#/components/schemas/CreateInstitutionRequest'
        - type: object
          required: [id, active]
          properties:
            id: { type: string }
            active: { type: boolean }
    DirectoryEntry:
      type: object
      required: [id, name, phone, scope, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        scope: { type: string, enum: [national, local] }
        institutionId: { type: string }
        siteId: { type: string }
        districtId: { type: integer }
        active: { type: boolean }
        isDemo: { type: boolean }
    DirectoryEntryInput:
      type: object
      required: [name, phone, scope]
      properties:
        name: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 40 }
        scope: { type: string, enum: [national, local] }
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        districtId: { type: integer, minimum: 1 }
    PublicAlert:
      type: object
      required: [id, title, message, validFrom, validUntil, districtId]
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        districtId: { type: integer, nullable: true }
    AlertInput:
      type: object
      required: [type, title, message, validFrom, validUntil]
      properties:
        districtId: { type: integer, nullable: true }
        type: { type: string, maxLength: 60 }
        title: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 2000 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    Alert:
      allOf:
        - $ref: '#/components/schemas/PublicAlert'
        - type: object
          required: [authorUserId, active]
          properties:
            authorUserId: { type: string, format: uuid }
            active: { type: boolean }
            isDemo: { type: boolean }
            createdAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, title, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid, nullable: true }
        alertId: { type: string, format: uuid, nullable: true }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actorUserId, action, entityType, entityId, createdAt]
      properties:
        id: { type: integer }
        actorUserId: { type: string, format: uuid, nullable: true }
        institutionId: { type: string, format: uuid, nullable: true }
        siteId: { type: string, format: uuid, nullable: true }
        correlationId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        beforeData: { type: object, nullable: true }
        afterData: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
    HeatmapCell:
      type: object
      required: [cellId, count, latitude, longitude, cellSizeDegrees]
      properties:
        cellId: { type: string, description: "Identificador de celda agregada, no punto GPS" }
        count: { type: integer, minimum: 3 }
        latitude: { type: number, description: Centro de celda agregada }
        longitude: { type: number, description: Centro de celda agregada }
        cellSizeDegrees: { type: number, enum: [0.05, 0.2] }
    OperationalMap:
      type: object
      required: [incidents, sites]
      properties:
        incidents:
          type: array
          items:
            type: object
            required: [id, reference, status, categoryId, latitude, longitude]
            properties:
              id: { type: string, format: uuid }
              reference: { type: string }
              status: { type: string }
              categoryId: { type: integer }
              latitude: { type: number }
              longitude: { type: number }
        sites:
          type: array
          items:
            type: object
            required: [id, institutionId, name, latitude, longitude]
            properties:
              id: { type: string, format: uuid }
              institutionId: { type: string, format: uuid }
              name: { type: string }
              latitude: { type: number }
              longitude: { type: number }
    OperationalStats:
      type: object
      required: [total, byStatus, byCategory, averageAssignmentMinutes]
      properties:
        total: { type: integer, minimum: 0 }
        byStatus: { type: object, additionalProperties: { type: integer } }
        byCategory: { type: object, additionalProperties: { type: integer } }
        averageAssignmentMinutes: { type: number, nullable: true }
