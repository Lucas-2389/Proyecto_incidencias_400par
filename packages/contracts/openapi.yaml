openapi: 3.0.3
info:
  title: API de gestión de incidencias
  version: 0.1.0
  description: >-
    Contrato inicial de la plataforma. Las operaciones se implementarán por
    iteración; publicar este archivo no implica que los endpoints estén activos.
x-access-roles:
  - SuperAdministrador
  - AdministradorInstitucional
  - Operador
  - Ciudadano
x-access-policy:
  public: [health, register, login, refresh, logout, password-reset, directory, alerts, aggregated-heatmap]
  citizen: [create-mobile-incident, own-incidents, own-evidence, own-notifications]
  operator: [institutional-inbox, phone-incident, verification, dispatch, status, authorized-map]
  institutional-admin: [institutional-users, own-sites, own-resources, own-audit]
  super-admin: [all-institutions, catalogs, territories, routing-rules, global-audit]
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local (desde Iteración 1)
tags:
  - name: Technical
  - name: Auth
  - name: Incidents
  - name: Operations
  - name: Institutions
  - name: Territory
  - name: Resources
  - name: Public
paths:
  /api/health:
    servers:
      - url: http://localhost:3000
        description: Raíz HTTP local para endpoints técnicos
    get:
      tags: [Technical]
      summary: Comprobar que el proceso HTTP está activo
      operationId: getProcessHealth
      responses:
        '200':
          description: Proceso activo
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/health/database:
    servers:
      - url: http://localhost:3000
        description: Raíz HTTP local para endpoints técnicos
    get:
      tags: [Technical]
      summary: Comprobar conectividad real con MySQL
      operationId: getDatabaseHealth
      responses:
        '200':
          description: Consulta de diagnóstico correcta
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [connected] }
        '503':
          description: Base de datos no disponible o credenciales rechazadas
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthError'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar ciudadano
      operationId: registerCitizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar token de actualización
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Nuevos tokens; el token anterior queda revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar token de actualización
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sesión revocada }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicitar recuperación sin revelar si existe el correo
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirmar token de un uso y establecer contraseña nueva
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '200':
          description: Contraseña actualizada y sesiones anteriores invalidadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /incidents:
    post:
      tags: [Incidents]
      summary: Crear reporte ciudadano o preliminar de invitado
      description: >-
        Un invitado genera un reporte no verificado. La misma Idempotency-Key
        debe devolver el mismo reporte al reintentar, sin crear duplicados.
      operationId: createIncident
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Reporte recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReceipt'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /incidents/mine:
    get:
      tags: [Incidents]
      summary: Listar reportes propios
      operationId: listMyIncidents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reportes del ciudadano autenticado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Obtener detalle autorizado
      operationId: getIncident
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Detalle del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{id}/evidence:
    post:
      tags: [Incidents]
      summary: Adjuntar fotografía al reporte
      operationId: uploadIncidentEvidence
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Fotografía almacenada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceMetadata'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ops/incidents:
    get:
      tags: [Operations]
      summary: Bandeja institucional filtrada por ámbito autorizado
      operationId: listOperationalIncidents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IncidentStatus' }
      responses:
        '200':
          description: Incidencias autorizadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/incidents/{id}/status:
    patch:
      tags: [Operations]
      summary: Actualizar estado de atención
      operationId: updateIncidentStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/IncidentStatus' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ops/incidents/{id}/assignments:
    post:
      tags: [Operations]
      summary: Asignar institución, sede, unidades y personal
      operationId: createAssignment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/institutions:
    get:
      tags: [Institutions]
      summary: Listar instituciones autorizadas
      operationId: listInstitutions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Instituciones visibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Institution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Institutions]
      summary: Registrar institución
      operationId: createInstitution
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstitutionRequest' }
      responses:
        '201':
          description: Institución creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/institutions/{id}:
    get:
      tags: [Institutions]
      operationId: getInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      responses:
        '200':
          description: Institución autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Institutions]
      operationId: updateInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInstitutionRequest' }
      responses:
        '200':
          description: Institución actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Institution' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Institutions]
      operationId: deactivateInstitution
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      responses:
        '204': { description: Institución desactivada sin borrar historial }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /territory/departments:
    get:
      tags: [Territory]
      operationId: listDepartments
      responses:
        '200':
          description: Departamentos configurados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
  /territory/provinces:
    get:
      tags: [Territory]
      operationId: listProvinces
      parameters: [{ name: departmentId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Provincias configuradas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /territory/districts:
    get:
      tags: [Territory]
      operationId: listDistricts
      parameters: [{ name: provinceId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Distritos configurados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /territory/sectors:
    get:
      tags: [Territory]
      operationId: listSectors
      parameters: [{ name: districtId, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: Sectores configurados
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Territory' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /territory/resolve:
    get:
      tags: [Territory]
      operationId: resolveTerritory
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Distrito y sector o null cuando no hay polígono
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerritoryResolution' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/sites:
    get:
      tags: [Institutions]
      operationId: listSites
      security: [{ bearerAuth: [] }]
      parameters: [{ name: institutionId, in: query, schema: { type: string } }]
      responses:
        '200':
          description: Sedes del ámbito autorizado
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Site' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Institutions]
      operationId: createSite
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '201':
          description: Sede creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/sites/{id}:
    get:
      tags: [Institutions]
      operationId: getSite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Sede autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Institutions]
      operationId: updateSite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '200':
          description: Sede actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Institutions]
      operationId: deactivateSite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Sede desactivada sin borrar historial }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/coverage/candidates:
    get:
      tags: [Institutions]
      operationId: listCoveredSites
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number } }
        - { name: longitude, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: Sedes activas con cobertura coincidente
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CoveredSite' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/coverage/sites/{siteId}:
    get:
      tags: [Institutions]
      operationId: listSiteCoverage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SiteId' }]
      responses:
        '200':
          description: Zonas de cobertura de una sede
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CoverageZone' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Institutions]
      operationId: createSiteCoverage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SiteId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageInput' }
      responses:
        '201':
          description: Zona agregada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageZone' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /admin/coverage/{id}:
    patch:
      tags: [Institutions]
      operationId: updateCoverage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { active: { type: boolean } } }
      responses:
        '200':
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageZone' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Institutions]
      operationId: deactivateCoverage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Zona desactivada }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      tags: [Institutions]
      operationId: listInstitutionalUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: institutionId, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Usuarios institucionales del ámbito
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstitutionalUser' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Institutions]
      operationId: createInstitutionalUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionalUserInput' }
      responses:
        '201':
          description: Cuenta institucional creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{id}:
    patch:
      tags: [Institutions]
      operationId: updateInstitutionalUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, status: { type: string, enum: [active, inactive] } } }
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionalUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /resources/personnel:
    get:
      tags: [Resources]
      operationId: listPersonnel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: institutionId, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Personal visible del ámbito
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Personnel' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Resources]
      operationId: createPersonnel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonnelInput' }
      responses:
        '201':
          description: Personal creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personnel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /resources/personnel/{id}:
    get:
      tags: [Resources]
      operationId: getPersonnel
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Personal autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personnel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      operationId: updatePersonnel
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonnelInput' }
      responses:
        '200':
          description: Personal actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personnel' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Resources]
      operationId: deactivatePersonnel
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Personal desactivado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /resources/units:
    get:
      tags: [Resources]
      operationId: listUnits
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: institutionId, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string } }
        - { name: available, in: query, schema: { type: boolean }, description: Solo unidades disponibles si es true }
      responses:
        '200':
          description: Unidades visibles del ámbito
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Unit' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      tags: [Resources]
      operationId: createUnit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitInput' }
      responses:
        '201':
          description: Unidad creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /resources/units/{id}:
    get:
      tags: [Resources]
      operationId: getUnit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Unidad autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      operationId: updateUnit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitInput' }
      responses:
        '200':
          description: Unidad actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Resources]
      operationId: deactivateUnit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Unidad fuera de servicio }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /resources/units/{id}/status:
    patch:
      tags: [Resources]
      operationId: changeUnitStatus
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/UnitStatus' }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cambio válido persistido en historial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /public/directory:
    get:
      tags: [Public]
      summary: Directorio de emergencias por territorio
      operationId: getEmergencyDirectory
      parameters:
        - name: districtId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Números nacionales y locales aplicables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DirectoryEntry' }
  /public/alerts:
    get:
      tags: [Public]
      summary: Alertas públicas vigentes
      operationId: listPublicAlerts
      responses:
        '200':
          description: Alertas activas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicAlert' }
  /public/heatmap:
    get:
      tags: [Public]
      summary: Agregados espaciales sin ubicaciones exactas sensibles
      operationId: getPublicHeatmap
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: districtId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Conteos por celda agregada
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HeatmapCell' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InstitutionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificador único del intento de creación generado por el cliente.
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Acceso fuera del rol o ámbito autorizado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflicto de estado o duplicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Límite de solicitudes superado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnprocessableEntity:
      description: Contraseña fuera de la política de seguridad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Servicio de autenticación o recuperación no configurado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    PersonnelInput:
      type: object
      required: [institutionId, siteId, code, name]
      properties:
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 150 }
        roleDescription: { type: string, maxLength: 100, nullable: true }
        active: { type: boolean }
    Personnel:
      allOf:
        - { $ref: '#/components/schemas/PersonnelInput' }
        - type: object
          required: [id, active, isDemo]
          properties:
            id: { type: string, format: uuid }
            isDemo: { type: boolean }
    UnitInput:
      type: object
      required: [institutionId, siteId, code, type]
      properties:
        institutionId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        type: { type: string, maxLength: 80 }
        plate: { type: string, maxLength: 30, nullable: true }
        capacityDescription: { type: string, maxLength: 200, nullable: true }
    UnitStatus:
      type: string
      enum: [available, assigned, en_route, attending, returning, maintenance, out_of_service]
    Unit:
      allOf:
        - { $ref: '#/components/schemas/UnitInput' }
        - type: object
          required: [id, status, isDemo]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/UnitStatus' }
            isDemo: { type: boolean }
    Territory:
      type: object
      required: [id, code, name, isDemo]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        isDemo: { type: boolean }
        departmentId: { type: integer }
        provinceId: { type: integer }
        districtId: { type: integer }
    TerritoryResolution:
      type: object
      required: [latitude, longitude, district, sector]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        district: { allOf: [{ $ref: '#/components/schemas/Territory' }], nullable: true }
        sector: { allOf: [{ $ref: '#/components/schemas/Territory' }], nullable: true }
    SiteInput:
      type: object
      required: [institutionId, name, location]
      properties:
        institutionId: { type: string, format: uuid }
        districtId: { type: integer }
        name: { type: string }
        address: { type: string }
        contactPhone: { type: string }
        location:
          type: object
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        active: { type: boolean }
    Site:
      allOf:
        - { $ref: '#/components/schemas/SiteInput' }
        - type: object
          required: [id, active, isDemo]
          properties:
            id: { type: string, format: uuid }
            isDemo: { type: boolean }
    CoverageInput:
      type: object
      required: [name, coordinates]
      properties:
        name: { type: string }
        coordinates:
          type: array
          minItems: 4
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    CoverageZone:
      type: object
      required: [id, siteId, institutionId, name, active, isDemo, geometry]
      properties:
        id: { type: integer }
        siteId: { type: string }
        institutionId: { type: string }
        name: { type: string }
        active: { type: boolean }
        isDemo: { type: boolean }
        geometry: { type: object, description: GeoJSON MultiPolygon }
    CoveredSite:
      type: object
      required: [siteId, institutionId, siteName]
      properties:
        siteId: { type: string }
        institutionId: { type: string }
        siteName: { type: string }
    InstitutionalUserInput:
      type: object
      required: [name, email, password, role, institutionId, siteId]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        role: { type: string, enum: [Operador, AdministradorInstitucional] }
        institutionId: { type: string }
        siteId: { type: string }
    InstitutionalUser:
      type: object
      required: [id, name, email, status, role, institutionId, siteId]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive] }
        role: { type: string }
        institutionId: { type: string }
        siteId: { type: string }
    DatabaseHealthError:
      type: object
      required: [status, database, code, message, correlationId]
      properties:
        status: { type: string, enum: [error] }
        database: { type: string, enum: [unavailable] }
        code: { type: string, enum: [DATABASE_UNAVAILABLE] }
        message: { type: string }
        correlationId: { type: string, format: uuid }
    ApiError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        correlationId: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password, acceptedTerms]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        acceptedTerms: { type: boolean, enum: [true] }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 40, maxLength: 256 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 40, maxLength: 256 }
        password: { type: string, format: password, minLength: 12 }
    AcceptedStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    OkStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Duración en segundos }
        user:
          type: object
          required: [id, name, email, roles]
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            roles:
              type: array
              items: { type: string }
    Coordinates:
      type: object
      required: [latitude, longitude, capturedAt]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        reference: { type: string, maxLength: 500 }
    CreateIncidentRequest:
      type: object
      required: [categoryId, location, description]
      properties:
        categoryId: { type: string }
        subcategoryId: { type: string }
        location: { $ref: '#/components/schemas/Coordinates' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        affectedPeople: { type: integer, minimum: 0 }
    IncidentStatus:
      type: string
      enum: [reported, verifying, assigned, en_route, attending, resolved, closed]
    IncidentReceipt:
      type: object
      required: [id, reference, status, verified, createdAt]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
    IncidentSummary:
      allOf:
        - $ref: '#/components/schemas/IncidentReceipt'
        - type: object
          properties:
            categoryId: { type: string }
            subcategoryId: { type: string }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            description: { type: string }
            location: { $ref: '#/components/schemas/Coordinates' }
            evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceMetadata' } }
    EvidenceMetadata:
      type: object
      required: [id, mediaType, uploadedAt]
      properties:
        id: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        uploadedAt: { type: string, format: date-time }
    CreateAssignmentRequest:
      type: object
      required: [institutionId, siteId]
      properties:
        institutionId: { type: string }
        siteId: { type: string }
        unitIds: { type: array, items: { type: string }, uniqueItems: true }
        personnelIds: { type: array, items: { type: string }, uniqueItems: true }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/CreateAssignmentRequest'
        - type: object
          required: [id, incidentId, createdAt]
          properties:
            id: { type: string }
            incidentId: { type: string }
            createdAt: { type: string, format: date-time }
    CreateInstitutionRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [pnp, samu, bomberos, municipalidad, otra] }
        contactPhone: { type: string }
    Institution:
      allOf:
        - $ref: '#/components/schemas/CreateInstitutionRequest'
        - type: object
          required: [id, active]
          properties:
            id: { type: string }
            active: { type: boolean }
    DirectoryEntry:
      type: object
      required: [name, phone, scope]
      properties:
        name: { type: string }
        phone: { type: string }
        scope: { type: string, enum: [national, local] }
        institutionId: { type: string }
    PublicAlert:
      type: object
      required: [id, title, message, validUntil]
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        validUntil: { type: string, format: date-time }
        districtIds: { type: array, items: { type: string } }
    HeatmapCell:
      type: object
      required: [cellId, count]
      properties:
        cellId: { type: string, description: "Identificador de celda agregada, no punto GPS" }
        count: { type: integer, minimum: 0 }
